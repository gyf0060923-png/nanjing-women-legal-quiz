<body>
  <main class="app" id="app">
    <div class="backdrop" aria-hidden="true"></div>
    <div class="wash" aria-hidden="true"></div>
    <button class="sound" id="soundBtn" type="button" aria-label="关闭音效" aria-pressed="true">
      <span aria-hidden="true">♪</span>
    </button>

    <section class="screen intro is-active" id="introScreen" aria-labelledby="introTitle">
      <div class="cover-logo" style="padding:0;background:none;border-radius:0;box-shadow:none" aria-label="南京市妇女联合会">
        <img src="./assets/nanjing-women-logo.png?v=20260917-2" alt="南京市妇女联合会" decoding="async">
      </div>
      <div class="intro-copy">
        <h1 id="introTitle"><span class="title-main">巾帼普法基层行</span><span class="title-sub">（新兴领域女性篇）</span></h1>
      </div>
      <button class="primary-btn start-btn" id="startBtn" type="button" aria-live="polite">
        <i class="start-progress" id="startProgress" aria-hidden="true"></i>
        <span id="startLabel">开始闯关</span><b id="startArrow" aria-hidden="true">→</b>
      </button>
    </section>

    <section class="screen story" id="storyScreen" aria-label="答题情景">
      <header class="story-head">
        <div class="brand-pill compact">巾帼普法基层行</div>
      </header>
      <div class="progress-track story-track" aria-hidden="true"><span id="storyProgressBar"></span></div>
      <div class="level-caption story-level-caption" id="storyLevelCaption">【关卡一】</div>
      <figure class="story-frame">
        <img id="storyImage" src="./assets/question-1-v3.webp" alt="第一关情景插画" decoding="async" fetchpriority="high">
      </figure>
      <button class="primary-btn story-btn" id="enterQuestionBtn" type="button">进入答题 <b aria-hidden="true">›</b></button>
    </section>

    <section class="screen quiz" id="quizScreen" aria-labelledby="questionText">
      <header class="quiz-head">
        <div class="brand-pill compact">巾帼普法基层行</div>
      </header>
      <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>

      <article class="question-card" id="questionCard">
        <div class="level-caption quiz-level-caption" id="quizLevelBadge">【关卡一】</div>
        <h2 id="questionText"></h2>
        <div class="answers" id="answers"></div>
      </article>
      <p class="tap-tip">请选择你认为正确的答案</p>
    </section>

    <section class="screen result" id="resultScreen" aria-labelledby="resultTitle">
      <div class="brand-pill">巾帼普法基层行</div>
      <div class="result-card">
        <div class="result-medal" aria-hidden="true">
          <svg viewBox="0 0 120 120" focusable="false">
            <path d="M60 8C43 8 35 21 38 36C26 28 14 31 8 45C2 60 10 75 27 77C23 92 33 107 47 110C59 113 68 106 72 97C81 107 94 109 103 99C111 90 109 77 101 70C115 66 119 52 111 40C103 28 91 28 80 35C81 20 74 8 60 8Z" fill="#ac4433" stroke="#211817" stroke-width="2.5" stroke-linejoin="round"/>
            <g fill="none" stroke="#211817" stroke-width="2" stroke-linecap="round">
              <path d="M54 33l1 8M65 33l-1 8M36 52l-8-2M36 62l-8 1M84 51l8-3M85 61l8-1M46 81l-4 9M54 84l-1 9M75 82l5 9M83 77l8 6"/>
            </g>
            <circle cx="60" cy="60" r="10" fill="#fff06a" stroke="#211817" stroke-width="2.5"/>
          </svg>
        </div>
        <p class="eyebrow">挑战完成</p>
        <h2 id="resultTitle">权益知识达人</h2>
        <p class="score"><strong id="scoreNo">5</strong><span>/ 5</span></p>
        <p class="result-note" id="resultNote">每一次了解，都是守护自己与他人的力量。</p>
      </div>
      <button class="primary-btn" id="restartBtn" type="button">再答一次</button>
    </section>

    <div class="feedback" id="feedback" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle" hidden>
      <div class="feedback-shade"></div>
      <div class="feedback-wrap">
        <div class="feedback-pop" id="feedbackPop">
          <div class="face" id="face" aria-hidden="true">🎉</div>
          <div class="ribbon" id="feedbackTitle">答对啦</div>
          <div class="analysis-card">
            <p class="correct-line">正确答案：<strong id="correctAnswer">A</strong></p>
            <p class="analysis" id="analysisText"></p>
          </div>
        </div>
        <button class="next-btn" id="nextBtn" type="button">挑战下一关</button>
      </div>
    </div>
  </main>
